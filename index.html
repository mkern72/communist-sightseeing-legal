<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HELD - Communist Sightseeing — Legal</title>
<meta name="description" content="Privacy policy and account deletion for the HELD - Communist Sightseeing mobile app.">
<style>
  :root {
    --paper: #F7F4EE; --surface: #FFFFFF; --border: #E3DED2;
    --ink: #1A1A18; --ink80: #4A4A46; --ink60: #6B675E; --accent: #8C1D2B;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14140F; --surface: #1D1D18; --border: #33322B;
      --ink: #F2EFE7; --ink80: #CFCBC0; --ink60: #A5A196; --accent: #E4808B;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 400 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 40rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
  h1 {
    font-size: 1.9rem; line-height: 1.2; letter-spacing: -0.02em;
    margin: 0 0 0.5rem; color: var(--accent);
  }
  p { color: var(--ink80); margin: 0 0 2rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { margin-bottom: 0.75rem; }
  a.card {
    display: block; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 1rem 1.15rem; text-decoration: none;
    color: var(--accent); font-weight: 600;
  }
  a.card span { display: block; color: var(--ink60); font-weight: 400; font-size: 0.9rem; }
  a.card:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>HELD - Communist Sightseeing</h1>
  <p>Legal documents for the mobile app.</p>
  <ul>
    <li><a class="card" href="./privacy-policy">Privacy policy<span>What the app collects, and what it does not.</span></a></li>
    <li><a class="card" href="./account-deletion">Delete your account<span>How to remove your account and everything in it.</span></a></li>
  </ul>
</main>
</body>
</html>
